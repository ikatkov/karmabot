[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karmabot"
version = "1.0.3"
description = "A Slack bot to track Karma points"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Jay Kline", email = "jay.kline@target.com" }
]
urls = { Homepage = "https://github.com/target/karmabot" }
dependencies = [
    "Flask==2.2.2",
    "Werkzeug==2.2.3",
    "urlfetch==1.2.2",
    "opentelemetry-api>=1.39.0,<2",
    "opentelemetry-sdk>=1.39.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0,<2",
    "python-json-logger==2.0.4",
    "flask-executor==1.0.0",
    "hvac==1.0.2",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "radon>=6.0.1,<7",
    "ruff>=0.14.0,<0.15",
]

[tool.setuptools.packages.find]
include = ["karmabot*"]

[tool.ruff]
line-length = 150
exclude = [".git"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:werkzeug.*",
    "ignore:ast\\.Str is deprecated.*:DeprecationWarning",
    "ignore:Attribute s is deprecated.*:DeprecationWarning",
]
