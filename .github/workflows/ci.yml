name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --frozen --all-groups --python 3.10

      - name: Ruff
        run: uv run ruff check karmabot tests

      - name: Pytest
        run: uv run pytest

      - name: Radon
        run: uv run radon cc karmabot -a -nc

      - name: Docker build
        run: docker build -t karmabot-ci .
